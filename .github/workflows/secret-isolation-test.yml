name: "TEMPORARY secret isolation test"

# DELETE THIS WORKFLOW once the results are recorded. It exists to answer one
# question with evidence rather than assumption: can a job that has NOT been approved
# obtain the signing secret?
#
# It uses a DISPOSABLE value (TEST_DISPOSABLE_SECRET), never the production signing
# key. Deliberately printing a real key to prove masking works would create the exact
# exposure the exercise is meant to rule out, and deleting the workflow afterwards
# does not retract a published log.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # T1 - a job with NO environment declared. This is what a contributor's workflow
  # change would look like. It should receive NOTHING.
  unapproved:
    name: "T1/T3 - no environment declared"
    runs-on: ubuntu-latest
    steps:
      - name: Can an ungated job read the environment secret?
        env:
          LEAKED: ${{ secrets.TEST_DISPOSABLE_SECRET }}
        run: |
          if [ -z "$LEAKED" ]; then
            echo "PASS: ungated job received an EMPTY value - environment scoping holds."
          else
            echo "FAIL: ungated job obtained ${#LEAKED} characters of the secret."
            exit 1
          fi

      - name: Does `secrets: inherit` change that? (repository-level check)
        env:
          LEAKED: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # The production key must NOT be a repository secret. If this prints a
          # length, it was added at the wrong scope and every contributor workflow
          # can read it.
          if [ -z "$LEAKED" ]; then
            echo "PASS: no repository-level signing key exists."
          else
            echo "FAIL: a repository-level signing key is readable here (${#LEAKED} chars)."
            exit 1
          fi

  # T2/T3 - a job that DOES declare the environment. Runs only after approval.
  # Demonstrates both that masking works and, more importantly, that masking is not
  # the control - a transformed value defeats it.
  approved:
    name: "T2/T5 - environment declared (expect an approval pause)"
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Masking of the raw value
        env:
          S: ${{ secrets.TEST_DISPOSABLE_SECRET }}
        run: |
          echo "raw value follows; GitHub should redact it:"
          echo "$S"
          echo "length was ${#S} characters"

      - name: Masking does NOT survive transformation
        env:
          S: ${{ secrets.TEST_DISPOSABLE_SECRET }}
        run: |
          # The point of this step: a base64 of the secret is a different string, so
          # GitHub's redaction does not recognise it. This is why the approval gate,
          # not log masking, is the security boundary - and why an approved job is
          # trusted code by definition.
          echo "base64 of the disposable value:"
          printf '%s' "$S" | base64 -w0
          echo
          echo "If that printed readable base64, masking was defeated by transformation."
