name: "Windows NSIS Build"

on:
  workflow_dispatch:
  push:
    branches:
      - build/v1.0.4-validation

# This build uploads a workflow artifact only. It does not create a tag,
# GitHub Release, or updater manifest.
permissions:
  # The reusable workflow declares contents:write for its release-capable path.
  # This validation caller passes no release ID, so Tauri only uploads an
  # Actions artifact, but GitHub still requires matching inherited permission.
  contents: write

concurrency:
  group: windows-nsis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 NSIS
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: >-
        --bundles nsis
        --config src-tauri/tauri.windows-ci.conf.json
        --no-sign
      asset-prefix: handy-windows
      upload-artifacts: true
      sign-binaries: false
      is-debug-build: false
