name: "Windows NSIS Build"

on:
  workflow_dispatch:

# This build uploads a workflow artifact only. It does not create a tag,
# GitHub Release, or updater manifest.
permissions:
  # Read-only: build.yml's job is read-only too (it runs repository code and every
  # dependency's scripts), and a called workflow can only lower a caller's grant.
  contents: read

concurrency:
  group: windows-nsis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 NSIS
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      build-args: >-
        --bundles nsis
        --config src-tauri/tauri.windows-ci.conf.json
        --no-sign
      asset-prefix: handy-windows
      upload-artifacts: true
      sign-binaries: false
      is-debug-build: false
