<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Handy Tool app icon: technocratic hex badge; voice (waveform) becoming a done-task (check). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#134e5e"/>
    </linearGradient>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- hex nut outline (technocratic frame), flat-top hexagon centered at 512,512 r=340 -->
  <path d="M 342 217.6 L 682 217.6 L 852 512 L 682 806.4 L 342 806.4 L 172 512 Z"
        fill="none" stroke="url(#hex)" stroke-width="56" stroke-linejoin="round"/>

  <!-- waveform bars (voice) rising toward the check -->
  <rect x="316" y="452" width="64" height="120" rx="32" fill="#a5f3fc"/>
  <rect x="420" y="392" width="64" height="240" rx="32" fill="#a5f3fc"/>

  <!-- check (task done) -->
  <path d="M 524 560 L 600 640 L 744 400"
        fill="none" stroke="#ffffff" stroke-width="88" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
